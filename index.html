<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside First – first basket scorer per matchup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --raised:#e9edf2; --line:#dde2e9;
  --text:#18202b; --muted:#667180; --good:#1f9d63; --bad:#d4483b; --mid:#c98a12;
  --hot:#d9480f; --teamA:#3a6fd8; --teamB:#c98a12;
  --num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171e; --surface:#1a2129; --raised:#232c37; --line:#2b3542;
    --text:#ebeff4; --muted:#8e99a8; --good:#3cc786; --bad:#f06a5d; --mid:#e6a93a; --hot:#ff7a3d;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
.n{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .midc{color:var(--mid)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font:700 22px/1.1 var(--body);letter-spacing:-.01em}
.brand h1 span{color:var(--hot)}
.brand .btns{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.datebar{display:flex;align-items:center;gap:6px;padding:0 14px}
.datebar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:18px}
.datebar .d{flex:1;text-align:center;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 14px 8px}
.settings label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.settings label:first-child{margin-top:0}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}

.section{padding:12px 14px 0}
.section h2{font-size:14px;font-weight:600;color:var(--muted);margin:4px 2px 8px}
.games{display:grid;gap:8px}
.game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.game:hover{border-color:var(--muted)}
.game .tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.game .tm:last-child{justify-content:flex-end}
.game img{width:30px;height:30px;flex:none}
.game .mid{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom select{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.custom .vs{font-weight:600;color:var(--muted)}
.go{border:0;background:var(--text);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}

.hero{margin:4px 14px 0;border-radius:18px;padding:40px 16px 14px;color:#fff;background:linear-gradient(110deg,var(--teamA) 0%,color-mix(in srgb,var(--teamA) 70%,#000) 49%,color-mix(in srgb,var(--teamB) 70%,#000) 51%,var(--teamB) 100%);position:relative}
.hero .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hero .side img{width:56px;height:56px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.hero .side small{font-weight:500;font-size:12px;opacity:.9}
.hero .at{font:700 24px/1 var(--num);opacity:.9}
.hero .odds{text-align:center;font-size:13px;margin-top:10px;opacity:.95;font-weight:500}
.back{position:absolute;top:10px;left:10px;border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:12px 14px 0;overflow:hidden}
.card > h3{margin:0;padding:12px 14px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card > h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.env{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:10px 14px;font-size:13.5px;align-items:center}
.env .h{color:var(--muted);font-size:12px}
.env .n{font-size:18px;text-align:right}
.flags{padding:0 14px 12px;font-size:13px;color:var(--muted)}
.flags b{color:var(--text)}

.pick{display:grid;grid-template-columns:44px 1fr auto 36px;gap:10px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick img.h{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised)}
.pick .nm{font-weight:600;line-height:1.25}
.pick .sub{font-size:12px;color:var(--muted);line-height:1.35}
.pick .ln{text-align:right;line-height:1.05}
.pick .ln .n{font-size:26px;display:block;color:var(--hot)}
.pick .ln span{font-size:11.5px;color:var(--muted)}
.star{border:1px solid var(--line);background:var(--raised);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.star[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.prob{font-weight:700}
.inj{font-size:11px;color:var(--bad);font-weight:600}

.plist .pr{display:grid;grid-template-columns:1fr 34px 34px 34px 34px;gap:4px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.plist .pr:first-child{border-top:0}
.plist .pr.hd{cursor:default;color:var(--muted);font-size:12px;padding-top:8px;padding-bottom:6px}
.plist .pr .n{text-align:right;font-size:17px}
.plist .pr.hd span:not(:first-child){text-align:right}
.plist .pr .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.detail{background:var(--raised);padding:10px 14px 12px;border-top:1px solid var(--line)}
.detail table{background:var(--surface);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px}
td.n{font-size:16px}
.check{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px}
.check select,.check input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.check input{width:72px;font-family:var(--num);font-size:17px;font-weight:600}
.check output{font-weight:600}
.why{margin:8px 0 0;font-size:12.5px;color:var(--muted)}

.rec{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.rec:first-of-type{border-top:0}
.rec .sub{font-size:12px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:14px;padding:3px 9px}
.tag.hit{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.tag.miss{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.tag.wait{background:var(--raised);color:var(--muted)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.summary div{background:var(--raised);border-radius:10px;padding:8px;text-align:center}
.summary .n{font-size:26px;display:block;line-height:1}
.summary span{font-size:12px;color:var(--muted)}

.empty{padding:26px 22px;text-align:center;color:var(--muted)}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:14px;padding:12px 14px;margin:12px 14px;font-size:14px}
.loading{padding:36px 22px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hot);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.bar{height:6px;background:var(--raised);border-radius:4px;overflow:hidden;max-width:260px;margin:10px auto 0}
.bar i{display:block;height:100%;background:var(--hot);transition:width .2s}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;padding:0 18px}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:12px 14px 0;overflow:hidden}
.fb-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.fb-top img{width:26px;height:26px}
.fb-top small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12.5px}
.fb-main{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:14px}
.fb-main img.h{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised)}
.fb-main h3{margin:0;font-size:20px;line-height:1.15}
.fb-main .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.fb-main .p{text-align:right}
.fb-main .p .n{font-size:36px;line-height:.9;color:var(--hot);display:block}
.fb-main .p span{font-size:11.5px;color:var(--muted)}
.fb-why{padding:0 14px 12px;font-size:13px;color:var(--muted)}
.fb-why b{color:var(--text);font-weight:600}
.fb details{border-top:1px solid var(--line);padding:8px 14px 10px}
.fb details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.tip{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 14px}
.tip .pl{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:13px;font-weight:600;gap:4px}
.tip .pl img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised)}
.tip .pl .n{font-size:24px;line-height:1}
.tip .pl small{color:var(--muted);font-weight:400}
.tip .vs{font:700 18px/1 var(--num);color:var(--muted)}
.splitbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:0 14px 6px}
.splitbar i{display:block;height:100%}
.splitlbl{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:12.5px;color:var(--muted)}
.splitlbl b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Courtside <span>First</span></h1>
      <div class="btns"><button class="iconbtn" id="savedbtn">My picks</button><button class="iconbtn" id="setbtn" aria-expanded="false">Settings</button></div>
    </div>
  </div>
  <div id="settings" hidden></div>
  <div id="app"></div>
  <p class="note">Built from ESPN play-by-play: opening tips, who scores first, and projected starters. First basket bets are long shots even for the favorite, so compare the fair odds with your sportsbook’s price.</p>
</div>
<script>
/* ================= constants & helpers ================= */
const TEAMS = [
 [1,"ATL","Hawks"],[2,"BOS","Celtics"],[17,"BKN","Nets"],[30,"CHA","Hornets"],[4,"CHI","Bulls"],
 [5,"CLE","Cavaliers"],[6,"DAL","Mavericks"],[7,"DEN","Nuggets"],[8,"DET","Pistons"],[9,"GS","Warriors"],
 [10,"HOU","Rockets"],[11,"IND","Pacers"],[12,"LAC","Clippers"],[13,"LAL","Lakers"],[29,"MEM","Grizzlies"],
 [14,"MIA","Heat"],[15,"MIL","Bucks"],[16,"MIN","Timberwolves"],[3,"NO","Pelicans"],[18,"NY","Knicks"],
 [25,"OKC","Thunder"],[19,"ORL","Magic"],[20,"PHI","76ers"],[21,"PHX","Suns"],[22,"POR","Trail Blazers"],
 [23,"SAC","Kings"],[24,"SA","Spurs"],[28,"TOR","Raptors"],[26,"UTAH","Jazz"],[27,"WSH","Wizards"]
].map(([id,abbr,name])=>({id:String(id),abbr,name,logo:`https://a.espncdn.com/i/teamlogos/nba/500/${abbr.toLowerCase()}.png`}));
const teamById = id => TEAMS.find(t=>t.id===String(id));
const S = "https://site.api.espn.com/apis";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => isFinite(x) ? Math.round(x*100)+"%" : "–";
const pct1 = x => isFinite(x) ? (x*100).toFixed(1)+"%" : "–";
const head = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const seasonYear = () => { const d=new Date(); return d.getMonth()>=8 ? d.getFullYear()+1 : d.getFullYear(); };
const lastName = n => String(n||"").split(" ").slice(-1)[0];
const american = p => !(p>0 && p<1) ? "–" : p>=0.5 ? "-"+Math.round(p/(1-p)*100) : "+"+Math.round((1-p)/p*100);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g,"").trim();

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const settings = Object.assign({ft:0, last:1}, LS.get("cfb_settings", {}));
const saveSettings = () => LS.set("cfb_settings", settings);

async function getJSON(url){
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    const r = await fetch("https://corsproxy.io/?url="+encodeURIComponent(url));
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }
}
const soft = p => p.catch(()=>null);
async function runPool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ const it = items[i++]; try{ await fn(it); }catch(e){} }
  }));
}

/* ================= data ================= */
const state = {date:new Date(), games:null, gamesErr:null, view:"home", game:null};

async function teamSchedule(id, season){
  const cur = season===seasonYear();
  const key = `cfb_sched_${id}_${season}`, c = LS.get(key, null);
  if(c && (!cur || Date.now()-c.t < 2*3600e3)) return c.g;
  const j = await getJSON(`${S}/site/v2/sports/basketball/nba/teams/${id}/schedule${cur?"":`?season=${season}&seasontype=2`}`);
  const g = (j.events||[]).map(e=>{
      const c = e.competitions?.[0], st = c?.status?.type || e.status?.type || {};
      const typ = e.seasonType?.type ?? c?.type?.id;
      return {id:String(e.id||c?.id||""), d:Date.parse(e.date), done:!!st.completed || st.state==="post", pre:String(typ)==="1", post:String(typ)==="3"};
    }).filter(x=>x.id && x.done && !x.pre).sort((a,b)=>b.d-a.d).map(x=>[x.id,x.d]);
  LS.set(key, {t:Date.now(), g});
  return g;
}
function parseRoster(j){
  let list = j?.athletes||[];
  if(list.length && list[0].items) list = list.flatMap(x=>x.items||[]);
  return list.map(a=>{
    const inj = a.injuries?.[0];
    return {id:String(a.id), name:a.displayName||a.fullName||"", pos:a.position?.abbreviation||"",
            status: inj ? (inj.status||inj.type?.description||"Injured") : ""};
  });
}
const isOut = st => /out|suspend|doubt/i.test(st||"");

// compact game: {d, t:{teamId:[[id,name,fga,min,pos,starter]]}, j:[jumperA,jumperB], jw:tipWinnerPlayer, ft:firstPossTeam, ff:[player,team] first FG, fa:[player,team] first points}
const G_KEY = "cfb_games_v1";
let GAMES = LS.get(G_KEY, {});
function saveGames(){
  if(LS.set(G_KEY, GAMES)) return;
  const ids = Object.keys(GAMES).sort((a,b)=>(GAMES[b].d||0)-(GAMES[a].d||0));
  ids.slice(Math.floor(ids.length*0.75)).forEach(id=>delete GAMES[id]);
  LS.set(G_KEY, GAMES);
}
function parseGame(j){
  const comp = j?.header?.competitions?.[0];
  if(comp && comp.status?.type && !comp.status.type.completed) return null;
  const g = {d:Date.parse(comp?.date)||0, t:{}};
  const teamOf = {}, byName = {};
  for(const t of (j?.boxscore?.players||[])){
    const tid = String(t.team?.id||""), st = t.statistics?.[0]||{}, L = st.labels||[], N = st.names||[];
    let iM = L.indexOf("MIN"); if(iM<0) iM = N.indexOf("minutes");
    let iF = L.indexOf("FG"); if(iF<0) iF = N.indexOf("fieldGoalsMade-fieldGoalsAttempted");
    g.t[tid] = (st.athletes||[]).filter(a=>!a.didNotPlay && a.stats?.length).map(a=>{
      const id = String(a.athlete?.id||""), nm = a.athlete?.displayName||"";
      teamOf[id] = tid; byName[norm(nm)] = id;
      return [id, nm, parseFloat(String(a.stats[iF]).split("-")[1])||0, parseFloat(a.stats[iM])||0, a.athlete?.position?.abbreviation||"", a.starter?1:0];
    });
  }
  if(Object.keys(g.t).length!==2) return null;
  const plays = j?.plays || [];
  const pid = (pl,i) => String(pl.participants?.[i]?.athlete?.id || "");
  const jump = plays.find(p=>/jump ball/i.test(p.type?.text||"") || /jump ball/i.test(p.text||""));
  if(jump){
    const a = pid(jump,0), b = pid(jump,1);
    let w = pid(jump,2);
    if(!w){ const m = String(jump.text||"").match(/\(([^)]+?) gains possession\)/i); if(m) w = byName[norm(m[1])] || ""; }
    if(a && b && teamOf[a] && teamOf[b] && teamOf[a]!==teamOf[b]){
      g.j = [a,b];
      if(w && teamOf[w]){ g.ft = teamOf[w]; g.jw = teamOf[w]===teamOf[a] ? a : b; }
    }
  }
  const scoring = plays.filter(p=>p.scoringPlay && (p.period?.number||1)===1);
  const fa = scoring[0], ff = scoring.find(p=>(p.scoreValue||0)>=2 && !/free throw/i.test(p.type?.text||""));
  const rec = p => { if(!p) return null; const id = pid(p,0), tid = String(p.team?.id||teamOf[id]||""); return id && tid ? [id, tid] : null; };
  g.fa = rec(fa); g.ff = rec(ff);
  if(!g.ft && fa){ /* no tip info: leave first possession unknown */ }
  return g;
}

async function loadTeams(ids, step){
  const yr = seasonYear(), seasons = settings.last ? [yr, yr-1] : [yr];
  step("Getting schedules…", 0.03);
  const scheds = {};
  await Promise.all(ids.flatMap(id=>seasons.map(async s=>{ scheds[id+"_"+s] = ((await soft(teamSchedule(id, s))) || []).slice(0, s===yr ? 99 : 41); })));
  const want = [...new Set(Object.values(scheds).flat().map(g=>g[0]))];
  const need = want.filter(id=>!GAMES[id]);
  let done = 0;
  if(need.length) step(`Reading play-by-play… 0 of ${need.length}`, 0.08);
  await runPool(need, 8, async id=>{
    const g = parseGame(await getJSON(`${S}/site/v2/sports/basketball/nba/summary?event=${id}`));
    if(g) GAMES[id] = g;
    done++;
    if(done%3===0 || done===need.length) step(`Reading play-by-play… ${done} of ${need.length}${done<20?" (first time takes a minute, then it’s saved)":""}`, 0.08 + done/need.length*0.82);
    if(done%30===0) saveGames();
  });
  saveGames();
  const out = {};
  for(const id of ids){
    out[id] = seasons.flatMap(s=>(scheds[id+"_"+s]||[]).map(([gid])=>GAMES[gid] ? {...GAMES[gid], gid, w: s===yr ? 1 : 0.5} : null)).filter(Boolean).sort((a,b)=>b.d-a.d);
  }
  return out;
}

/* ================= the model ================= */
const FIRST = g => settings.ft ? g.fa : g.ff;

function tipRecord(playerId, gameLists){
  let w = 0, n = 0; const seen = new Set();
  for(const list of gameLists) for(const g of list){
    if(seen.has(g.gid) || !g.j || !g.jw || !g.j.includes(playerId)) continue;
    seen.add(g.gid); n += g.w; if(g.jw===playerId) w += g.w;
  }
  return {w, n, rate:(w+5)/(n+10)};   // shrunk toward 50%
}
const log5 = (a,b) => a*(1-b) / (a*(1-b) + b*(1-a));

function predictStarters(teamId, games, roster){
  const out = new Set(roster.filter(r=>isOut(r.status)).map(r=>r.id));
  const onTeam = new Set(roster.map(r=>r.id));
  const score = new Map(), info = new Map();
  games.filter(g=>g.w===1).slice(0,10).forEach((g,i)=>{
    for(const p of (g.t[teamId]||[])){
      info.set(p[0], p);
      const s = score.get(p[0]) || 0;
      score.set(p[0], s + (p[5] ? Math.pow(0.8,i)*10 : 0) + p[3]/48*Math.pow(0.8,i));
    }
  });
  const list = [...score.entries()].filter(([id])=>!out.has(id) && (!roster.length || onTeam.has(id))).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return list.map(([id])=>{ const r = roster.find(x=>x.id===id); const p = info.get(id); return {id, name:r?.name||p?.[1]||"", pos:r?.pos||p?.[4]||"", status:r?.status||""}; });
}

function teamFirstRates(teamId, games){
  // a: scores first when they got the first possession, b: scores first when they didn't
  let an=0, aw=0, bn=0, bw=0;
  for(const g of games){
    const f = FIRST(g); if(!f || !g.ft) continue;
    if(g.ft===teamId){ an+=g.w; if(f[1]===teamId) aw+=g.w; }
    else { bn+=g.w; if(f[1]===teamId) bw+=g.w; }
  }
  return {a:(aw+6*0.6)/(an+6), b:(bw+6*0.4)/(bn+6), an, bn};
}

function shares(teamId, starters, games){
  // who takes the team's first basket, from games he started, blended with his shot volume
  const rows = starters.map(s=>{
    let n=0, f=0, fga=0, gp=0;
    for(const g of games){
      const p = (g.t[teamId]||[]).find(x=>x[0]===s.id); if(!p) continue;
      if(g.w===1 || gp<15){ fga += p[2]; gp++; }
      const fb = FIRST(g);
      if(!p[5] || !fb || fb[1]!==teamId) continue;
      n += g.w; if(fb[0]===s.id) f += g.w;
    }
    return {...s, n, f, fgaPg: gp ? fga/gp : 0};
  });
  const tot = rows.reduce((a,r)=>a+r.fgaPg,0) || 1;
  rows.forEach(r=>{ r.prior = r.fgaPg/tot; r.raw = (r.f + 5*r.prior)/(r.n + 5); });
  const sum = rows.reduce((a,r)=>a+r.raw,0) || 1;
  rows.forEach(r=>r.share = r.raw/sum * 0.93);   // about 7% of first baskets come off the bench
  return rows;
}

function pickJumper(teamId, starters, games){
  const cnt = new Map();
  games.slice(0,20).forEach((g,i)=>{ if(!g.j) return; const id = g.j.find(x=>(g.t[teamId]||[]).some(p=>p[0]===x)); if(id) cnt.set(id, (cnt.get(id)||0) + Math.pow(0.9,i)); });
  const cands = starters.filter(s=>cnt.has(s.id)).sort((a,b)=>cnt.get(b.id)-cnt.get(a.id));
  if(cands.length) return cands[0];
  return starters.find(s=>/C/.test(s.pos)) || starters.find(s=>/F/.test(s.pos)) || starters[0];
}

function model(A, B, gA, gB, rA, rB){
  const sA = predictStarters(A, gA, rA), sB = predictStarters(B, gB, rB);
  const jA = pickJumper(A, sA, gA), jB = pickJumper(B, sB, gB);
  const tA = jA ? tipRecord(jA.id, [gA, gB]) : {w:0,n:0,rate:0.5};
  const tB = jB ? tipRecord(jB.id, [gA, gB]) : {w:0,n:0,rate:0.5};
  const pTipA = log5(tA.rate, tB.rate);
  const fA = teamFirstRates(A, gA), fB = teamFirstRates(B, gB);
  const aWin = (fA.a + (1-fB.b))/2, aLose = (fA.b + (1-fB.a))/2;
  const pA = pTipA*aWin + (1-pTipA)*aLose;
  const shA = shares(A, sA, gA), shB = shares(B, sB, gB);
  shA.forEach(r=>r.p = pA*r.share); shB.forEach(r=>r.p = (1-pA)*r.share);
  shA.sort((a,b)=>b.p-a.p); shB.sort((a,b)=>b.p-a.p);
  return {sA:shA, sB:shB, jA, jB, tA, tB, pTipA, pA, fA, fB, nA:gA.length, nB:gB.length};
}

/* ================= home ================= */
const fmtDate = d => d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
async function loadGames(){
  state.games = null; state.gamesErr = null; renderHome();
  const want = ymd(state.date);
  try{
    const j = await getJSON(`${S}/site/v2/sports/basketball/nba/scoreboard?dates=${want}`);
    if(ymd(state.date)!==want) return;
    state.games = (j.events||[]).map(e=>{
      const c = e.competitions?.[0]||{};
      const team = h => { const x = (c.competitors||[]).find(t=>t.homeAway===h); return x ? {id:String(x.team?.id||x.id), abbr:x.team?.abbreviation, name:x.team?.shortDisplayName||x.team?.name, logo:x.team?.logo||teamById(x.team?.id)?.logo, color:x.team?.color} : null; };
      const st = c.status?.type || e.status?.type || {};
      return {id:String(e.id), date:new Date(e.date), away:team("away"), home:team("home"),
              status: st.state==="pre" ? new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : (st.shortDetail||st.description||"")};
    }).filter(g=>g.away && g.home);
  }catch(err){ state.gamesErr = err.message; }
  renderHome();
}
function renderHome(){
  state.view = "home";
  const opts = () => `<option value="">Pick a team</option>` + TEAMS.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  let list;
  if(state.gamesErr) list = `<div class="err">Couldn’t load the schedule (${esc(state.gamesErr)}). Check your connection, or pick two teams below.</div>`;
  else if(!state.games) list = `<div class="loading"><div class="spin"></div>Loading games…</div>`;
  else if(!state.games.length) list = `<div class="empty">No NBA games on this day. Try another date.</div>`;
  else list = `<div class="games">${state.games.map((g,i)=>`
      <button class="game" data-gi="${i}">
        <span class="tm"><img src="${esc(g.away.logo)}" alt="">${esc(g.away.abbr)}</span>
        <span class="mid">@<br>${esc(g.status)}</span>
        <span class="tm">${esc(g.home.abbr)}<img src="${esc(g.home.logo)}" alt=""></span>
      </button>`).join("")}</div>`;
  $("#app").innerHTML = `
    <div class="datebar"><button id="prev" aria-label="Previous day">‹</button><div class="d">${esc(fmtDate(state.date))}</div><button id="next" aria-label="Next day">›</button></div>
    <div class="section"><h2>Tap a matchup</h2>${list}</div>
    <div class="section"><h2>Or pick two teams</h2>
      <div class="custom"><select id="ca" aria-label="First team">${opts()}</select><span class="vs">vs</span><select id="cb" aria-label="Second team">${opts()}</select><button class="go" id="cgo">Run</button></div>
    </div>`;
}

/* ================= matchup ================= */
let runId = 0;
const cleanColor = c => c && /^[0-9a-f]{6}$/i.test(c) && !/^(000000|ffffff)$/i.test(c) ? "#"+c : null;
function heroHTML(){
  const G = state.game, A = G.away, B = G.home;
  return `<div class="hero" style="--teamA:${esc(cleanColor(A.color)||"#3a6fd8")};--teamB:${esc(cleanColor(B.color)||"#c98a12")}">
    <button class="back">‹ Games</button>
    <div class="row">
      <div class="side"><img src="${esc(A.logo)}" alt="">${esc(A.name)}</div>
      <div class="at">VS</div>
      <div class="side"><img src="${esc(B.logo)}" alt="">${esc(B.name)}</div>
    </div></div>`;
}
function step(msg, frac){
  $("#app").innerHTML = `${heroHTML()}<div class="loading"><div class="spin"></div>${esc(msg)}${frac!=null?`<div class="bar"><i style="width:${Math.round(frac*100)}%"></i></div>`:""}</div>`;
}
async function openMatchup(G){
  const my = ++runId;
  state.view = "matchup"; state.game = G;
  window.scrollTo(0,0);
  const A = G.away.id, B = G.home.id;
  try{
    const games = await loadTeams([A,B], (m,f)=>{ if(my===runId) step(m,f); });
    if(my!==runId) return;
    step("Checking injuries and starters…", 0.95);
    const [rA, rB] = await Promise.all([A,B].map(id=>soft(getJSON(`${S}/site/v2/sports/basketball/nba/teams/${id}/roster`)).then(parseRoster)));
    if(!games[A].length || !games[B].length) throw new Error("no finished games found for one of these teams yet");
    state.m = model(A, B, games[A], games[B], rA, rB);
    if(my===runId) renderMatchup();
  }catch(err){
    if(my===runId) $("#app").innerHTML = `${heroHTML()}<div class="err">Couldn’t finish loading: ${esc(err.message)}. Go back and tap the matchup again.</div>`;
  }
}

function sideCard(team, rows, pTeam, isA){
  const m = state.m, best = rows[0];
  if(!best) return `<section class="fb"><div class="fb-top"><img src="${esc(team.logo)}" alt="">${esc(team.name)}</div><p class="empty">Couldn’t work out this team’s starters.</p></section>`;
  const saved = isSaved(best.id);
  const what = settings.ft ? "first points" : "first field goal";
  return `<section class="fb">
    <div class="fb-top"><img src="${esc(team.logo)}" alt="">${esc(team.name)}<small>team scores first: ${pct(pTeam)}</small></div>
    <div class="fb-main">
      <img class="h" src="${head(esc(best.id))}" alt="" onerror="this.style.visibility='hidden'">
      <div><h3>${esc(best.name)}</h3><div class="sub">${esc(best.pos||"")}${best.status?` <span class="inj">${esc(best.status)}</span>`:""}</div>
        <div class="sub">Fair odds ${american(best.p)}</div></div>
      <div class="p"><b class="n">${pct1(best.p)}</b><span>to score the<br>${what}</span></div>
    </div>
    <div class="fb-why">He took <b>${Math.round(best.f*1)||0}</b> of ${esc(team.abbr)}’s ${Math.round(best.n)||0} ${what}s in games he started (recent seasons weighted), and shoots <b>${best.fgaPg.toFixed(1)}</b> times a game. ${(best.share*100).toFixed(0)}% of ${esc(team.abbr)}’s first baskets go to him.
      <div style="margin-top:8px"><button class="iconbtn" data-save="${esc(best.id)}" aria-pressed="${saved}">${saved?"★ Saved":"☆ Save pick"}</button></div></div>
    <details><summary>All projected starters</summary>
      <table><thead><tr><th>Player</th><th>Share</th><th>Chance</th><th>Fair odds</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.name)}${r.status?` <span class="inj">${esc(r.status)}</span>`:""}</td><td>${pct(r.share)}</td><td class="n">${pct1(r.p)}</td><td>${american(r.p)}</td></tr>`).join("")}
      </tbody></table></details>
  </section>`;
}

function renderMatchup(){
  const G = state.game, A = G.away, B = G.home, m = state.m;
  const jp = (j, t, p) => j ? `<div class="pl"><img src="${head(esc(j.id))}" alt="" onerror="this.style.visibility='hidden'">${esc(j.name)}<b class="n">${pct(p)}</b><small>won ${Math.round(t.w)} of ${Math.round(t.n)} tips</small></div>` : `<div class="pl">Unknown</div>`;
  const ca = cleanColor(A.color)||"#3a6fd8", cb = cleanColor(B.color)||"#c98a12";
  $("#app").innerHTML = heroHTML() +
    sideCard(A, m.sA, m.pA, true) + sideCard(B, m.sB, 1-m.pA, false) + `
    <section class="card"><h3>Opening tip<small>projected jumpers</small></h3>
      <div class="tip">${jp(m.jA, m.tA, m.pTipA)}<span class="vs">VS</span>${jp(m.jB, m.tB, 1-m.pTipA)}</div>
      <div class="splitbar"><i style="width:${(m.pA*100).toFixed(1)}%;background:${esc(ca)}"></i><i style="flex:1;background:${esc(cb)}"></i></div>
      <div class="splitlbl"><span>${esc(A.abbr)} scores first <b>${pct(m.pA)}</b></span><span><b>${pct(1-m.pA)}</b> ${esc(B.abbr)}</span></div>
      <div class="flags">${esc(A.abbr)} score first ${pct(m.fA.a)} of the time after winning the tip, ${pct(m.fA.b)} after losing it. ${esc(B.abbr)}: ${pct(m.fB.a)} and ${pct(m.fB.b)}. Based on ${m.nA} ${esc(A.abbr)} and ${m.nB} ${esc(B.abbr)} games.</div>
    </section>`;
}

/* ================= saved picks ================= */
const SAVE_KEY = "cfb_saved";
const getSaved = () => LS.get(SAVE_KEY, []);
const isSaved = pid => getSaved().some(x=>x.pid===pid && x.gid===state.game?.id);
function toggleSave(pid){
  const s = getSaved(), i = s.findIndex(x=>x.pid===pid && x.gid===state.game.id);
  if(i>=0) s.splice(i,1);
  else {
    const r = [...state.m.sA, ...state.m.sB].find(x=>x.id===pid);
    const team = state.m.sA.includes(r) ? state.game.away : state.game.home;
    s.unshift({gid:state.game.id, d:state.game.date?.getTime()||Date.now(), pid, name:r.name, team:team.abbr, p:r.p, ft:settings.ft});
  }
  LS.set(SAVE_KEY, s.slice(0,300));
}
async function renderSaved(){
  state.view = "saved"; runId++;
  const s = getSaved();
  const draw = () => {
    const done = s.filter(x=>x.res!=null);
    const hits = done.filter(x=>x.res===1).length;
    const exp = done.reduce((a,x)=>a+x.p,0);
    $("#app").innerHTML = `<div class="section" style="padding-top:0"><button class="iconbtn back2">‹ Games</button></div>
      <section class="card"><h3>My picks<small>${s.length} saved</small></h3>
        ${done.length?`<div class="summary"><div><b class="n">${hits}/${done.length}</b><span>hit</span></div><div><b class="n">${pct(hits/done.length)}</b><span>actual</span></div><div><b class="n">${pct(exp/done.length)}</b><span>model said</span></div></div>`:""}
        ${s.length ? s.map((x,i)=>{ const tag = x.res==null ? `<span class="tag wait">${x.d>Date.now()?"Upcoming":"Pending"}</span>` : x.res===1 ? `<span class="tag hit">Hit</span>` : `<span class="tag miss">${esc(x.who||"Miss")}</span>`;
            return `<div class="rec"><div><b>${esc(x.name)} (${esc(x.team)})</b><div class="sub">${new Date(x.d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}, ${x.ft?"first points":"first field goal"}, model ${pct1(x.p)}, fair ${american(x.p)} <button class="del" data-del="${i}">Remove</button></div></div>${tag}</div>`; }).join("")
          : `<p class="empty">Tap “Save pick” on a player. After the game, the result shows up here so you can see how often the picks hit compared with what the model said.</p>`}
      </section>`;
  };
  draw();
  const pending = s.filter(x=>x.res==null && x.d < Date.now()-1.5*3600e3);
  if(!pending.length) return;
  await runPool([...new Set(pending.map(x=>x.gid))], 4, async gid=>{
    let g = GAMES[gid];
    if(!g){ g = parseGame(await getJSON(`${S}/site/v2/sports/basketball/nba/summary?event=${gid}`)); if(g) GAMES[gid] = g; }
    if(!g) return;
    for(const x of s.filter(y=>y.gid===gid && y.res==null)){
      const f = x.ft ? g.fa : g.ff; if(!f) continue;
      x.res = f[0]===x.pid ? 1 : 0;
      if(!x.res){ let nm=""; Object.values(g.t).forEach(t=>{ const p=t.find(q=>q[0]===f[0]); if(p) nm=p[1]; }); x.who = nm ? "Miss: "+lastName(nm) : "Miss"; }
    }
  });
  LS.set(SAVE_KEY, s); saveGames();
  if(state.view==="saved") draw();
}

/* ================= events ================= */
$("#app").addEventListener("click", e=>{
  if(state.view==="home"){
    if(e.target.closest("#prev")){ state.date = new Date(state.date.getTime()-864e5); return loadGames(); }
    if(e.target.closest("#next")){ state.date = new Date(state.date.getTime()+864e5); return loadGames(); }
    const g = e.target.closest(".game");
    if(g) return openMatchup(state.games[+g.dataset.gi]);
    if(e.target.closest("#cgo")){
      const a = $("#ca").value, b = $("#cb").value;
      if(!a || !b || a===b){ alert("Pick two different teams."); return; }
      return openMatchup({id:"custom-"+a+"-"+b, date:null, away:{...teamById(a)}, home:{...teamById(b)}});
    }
    return;
  }
  if(e.target.closest(".back, .back2")){ runId++; renderHome(); window.scrollTo(0,0); return; }
  if(state.view==="saved"){
    const d = e.target.closest("[data-del]");
    if(d){ const s = getSaved(); s.splice(+d.dataset.del,1); LS.set(SAVE_KEY, s); renderSaved(); }
    return;
  }
  const sv = e.target.closest("[data-save]");
  if(sv){ toggleSave(sv.dataset.save); renderMatchup(); }
});
$("#savedbtn").addEventListener("click", ()=>{ renderSaved(); window.scrollTo(0,0); });

function renderSettings(){
  const seg = (key, opts) => `<div class="seg">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${String(settings[key])===String(v)}">${l}</button>`).join("")}</div>`;
  $("#settings").innerHTML = `<div class="settings">
    <label>What counts as the first basket (match your sportsbook)</label>${seg("ft",[[0,"First field goal"],[1,"First points, incl. free throws"]])}
    <label>History used</label>${seg("last",[[1,"This + last season"],[0,"This season only"]])}
  </div>`;
}
$("#setbtn").addEventListener("click", ()=>{
  const el = $("#settings"), open = el.hidden;
  el.hidden = !open; $("#setbtn").setAttribute("aria-expanded", String(open));
  if(open) renderSettings();
});
$("#settings").addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]"); if(!b) return;
  const k = b.dataset.k, v = +b.dataset.v, changed = settings[k]!==v;
  settings[k] = v; saveSettings(); renderSettings();
  if(changed && state.view==="matchup") openMatchup(state.game);
});

loadGames();
</script>
